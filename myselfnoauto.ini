# 其他地区：匹配所有非美国地区的节点 (使用正则排除美国关键词)
custom_proxy_group=🏳️‍🌈 其他地区`select`^(?!.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|ATL|BUF|DFW|EWR|IAD|LAX|MCI|MIA|ORD|PHX|PDX|SEA|SJC)).*

# 美国节点：保持原有的精准匹配逻辑
